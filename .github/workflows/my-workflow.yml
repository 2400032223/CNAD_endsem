
name: GitHub actions secret demo

on:
  push:
    branches:
      - main

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Access secret securely
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Secret is missing"
            exit 1
          fi
          echo "Secret successfully accessed"
